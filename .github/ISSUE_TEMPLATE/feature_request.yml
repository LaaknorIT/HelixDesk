name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your IT department or MSP where HelixDesk falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like HelixDesk to do?
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who is this mainly for?
      options:
        - Internal IT departments
        - MSPs with multiple customers
        - Both
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: How do you handle this today, or how do other tools handle it?
  - type: markdown
    attributes:
      value: The current plan is in [docs/roadmap.md](https://github.com/LaaknorIT/HelixDesk/blob/main/docs/roadmap.md). Check it first, your idea may already be planned.
